<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encrypted Savepoint</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>Encrypted Savepoint</h1>
      <p class="subtitle">Server-backed encrypted backups with local fallback.</p>

      <section id="incognitoWarning" class="alert warning hidden"></section>
      <section id="offlineBanner" class="alert warning hidden"></section>
      <section id="status" class="alert hidden"></section>

      <section class="panel">
        <h2>Server Settings</h2>
        <div class="field">
          <label for="serverUrl">Server URL</label>
          <input id="serverUrl" type="text" placeholder="http://localhost:8787" />
        </div>
        <div class="row">
          <label for="preferServerMode">Prefer server mode</label>
          <input id="preferServerMode" type="checkbox" checked />
        </div>
        <div class="actions split">
          <button id="saveSettingsBtn" type="button">Save Settings</button>
          <button id="checkHealthBtn" type="button">Check Server</button>
        </div>
      </section>

      <section class="panel">
        <h2>Unlock</h2>
        <div class="field">
          <label for="password">Master password (min 8 chars)</label>
          <input id="password" type="password" minlength="8" autocomplete="off" />
        </div>
        <div class="actions split">
          <button id="setupLoginBtn" type="button">Setup / Login</button>
          <button id="lockBtn" type="button" class="muted">Lock</button>
        </div>
      </section>

      <section class="panel">
        <h2>Export</h2>
        <div class="field">
          <label for="filename">Export filename base (date auto-added)</label>
          <input id="filename" type="text" placeholder="tab-session" />
        </div>
        <div class="field">
          <label for="exportTarget">Export target</label>
          <select id="exportTarget">
            <option value="server">Server storage</option>
            <option value="local">Local file (.bsave)</option>
          </select>
        </div>
        <div class="actions">
          <button id="exportBtn" type="button">Export Current Window</button>
        </div>
      </section>

      <section class="panel">
        <h2>Local Import</h2>
        <div class="row">
          <label for="useMasterForLocalImport">Use master password for local import</label>
          <input id="useMasterForLocalImport" type="checkbox" checked />
        </div>
        <div class="field">
          <label for="localImportPassword">Import password (for selected file)</label>
          <input id="localImportPassword" type="password" minlength="8" autocomplete="off" />
        </div>
        <div class="field">
          <label for="importFile">Import encrypted session file</label>
          <input id="importFile" type="file" accept=".bsave,application/x-encrypted-tab-session" />
        </div>
        <div class="actions">
          <button id="importBtn" type="button">Import Into Current Window</button>
        </div>
      </section>

      <section class="panel">
        <h2>Server Browser</h2>
        <div class="actions">
          <button id="refreshSavesBtn" type="button">Refresh Server Saves</button>
        </div>
        <ul id="saveList" class="save-list"></ul>
      </section>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
